<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Umi, the friendly UMI catalog octopus">
  <defs>
    <radialGradient id="seaBg" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7fe3ff"/>
      <stop offset="45%" stop-color="#3aa7ff"/>
      <stop offset="100%" stop-color="#1657d8"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9ad4"/>
      <stop offset="55%" stop-color="#ff6fb6"/>
      <stop offset="100%" stop-color="#f24aa0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- glassy water bubble -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#seaBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#glass)"/>

  <!-- background bubbles -->
  <circle cx="26" cy="34" r="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="103" cy="26" r="3.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="98" cy="62" r="6" fill="#ffffff" opacity="0.22"/>
  <circle cx="20" cy="92" r="4" fill="#ffffff" opacity="0.28"/>

  <!-- octopus -->
  <g filter="url(#soft)">
    <!-- tentacles -->
    <g fill="url(#body)">
      <path d="M40 92 q-9 8 -7 20 q4 6 8 0 q-2 -10 6 -14 z"/>
      <path d="M52 100 q-4 12 0 22 q5 4 8 -2 q-3 -10 0 -18 z"/>
      <path d="M64 103 q0 13 0 21 q5 5 9 -1 q-2 -11 -1 -19 z"/>
      <path d="M76 100 q5 12 0 22 q-4 5 -8 -1 q3 -11 0 -18 z"/>
      <path d="M88 92 q9 9 7 20 q-4 6 -8 0 q2 -10 -6 -14 z"/>
    </g>
    <!-- head -->
    <path d="M64 30 c-21 0 -34 16 -34 38 c0 13 9 24 20 28 c6 2 22 2 28 0 c11 -4 20 -15 20 -28 c0 -22 -13 -38 -34 -38 z" fill="url(#body)"/>
    <!-- head highlight -->
    <ellipse cx="50" cy="46" rx="13" ry="9" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- eyes -->
  <g>
    <circle cx="52" cy="60" r="11" fill="#ffffff"/>
    <circle cx="76" cy="60" r="11" fill="#ffffff"/>
    <circle cx="54" cy="62" r="5.4" fill="#22314f"/>
    <circle cx="78" cy="62" r="5.4" fill="#22314f"/>
    <circle cx="55.6" cy="60.2" r="1.8" fill="#ffffff"/>
    <circle cx="79.6" cy="60.2" r="1.8" fill="#ffffff"/>
  </g>

  <!-- blush -->
  <ellipse cx="42" cy="74" rx="5" ry="3" fill="#ff5aa0" opacity="0.5"/>
  <ellipse cx="86" cy="74" rx="5" ry="3" fill="#ff5aa0" opacity="0.5"/>

  <!-- smile -->
  <path d="M58 76 q6 7 12 0" fill="none" stroke="#22314f" stroke-width="3" stroke-linecap="round"/>
</svg>
