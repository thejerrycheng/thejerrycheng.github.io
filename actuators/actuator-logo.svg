<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Joint actuator guide mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4a"/><stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/><stop offset="100%" stop-color="#2f7dff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#rim)"/>
  <!-- gear -->
  <g fill="url(#gear)">
    <path d="M64 28 l6 0 3 11 a26 26 0 0 1 8 4.6 l10.5-4 4.2 4.2 -4 10.5 a26 26 0 0 1 4.6 8 l11 3 0 6 -11 3 a26 26 0 0 1 -4.6 8 l4 10.5 -4.2 4.2 -10.5-4 a26 26 0 0 1 -8 4.6 l-3 11 -6 0 -3-11 a26 26 0 0 1 -8-4.6 l-10.5 4 -4.2-4.2 4-10.5 a26 26 0 0 1 -4.6-8 l-11-3 0-6 11-3 a26 26 0 0 1 4.6-8 l-4-10.5 4.2-4.2 10.5 4 a26 26 0 0 1 8-4.6 z"/>
  </g>
  <!-- rotor hub -->
  <circle cx="64" cy="64" r="20" fill="#16181d"/>
  <circle cx="64" cy="64" r="20" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="9" fill="url(#gear)"/>
  <circle cx="64" cy="64" r="3.4" fill="#0e1014"/>
  <!-- torque arrow -->
  <path d="M64 47 a17 17 0 0 1 15 9" fill="none" stroke="#bfe0ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M79 56 l-1.5 -6 6 1.5 z" fill="#bfe0ff"/>
</svg>
