<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jerry Cheng — human-centric robotics">
  <defs>
    <!-- Liquid-glass blue -> indigo -> violet, matching the site gradient -->
    <linearGradient id="tile" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#4F5BE8"/>
      <stop offset="1"    stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Warm spark: the intelligence that lifts human labor -->
    <linearGradient id="spark" x1="24" y1="9" x2="40" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <!-- Soft glass sheen across the top -->
    <linearGradient id="sheen" x1="32" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sheen)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- AI spark (four-point sparkle) hovering above the face -->
  <polygon points="32,9 33.84,15.16 40,17 33.84,18.84 32,25 30.16,18.84 24,17 30.16,15.16"
           fill="url(#spark)"/>

  <!-- Two calm, human-centric companion eyes -->
  <circle cx="24" cy="41" r="4.6" fill="#ffffff"/>
  <circle cx="40" cy="41" r="4.6" fill="#ffffff"/>
</svg>
