<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cartoon MABEL standing in a comic panel beside its Vision Pro headset and battery">
  <defs>
    <pattern id="ht-sky" patternUnits="userSpaceOnUse" width="14" height="14">
      <circle cx="7" cy="7" r="1.6" fill="#151820" opacity="0.10"/>
    </pattern>
    <pattern id="ht-orange" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="1.7" fill="#F0762E" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- panel: halftone sky + warm wood floor -->
  <rect x="0" y="0" width="640" height="480" fill="#AECBE4"/>
  <rect x="0" y="0" width="640" height="480" fill="url(#ht-sky)"/>
  <rect x="0" y="330" width="640" height="150" fill="#C9985F"/>
  <path d="M0 330 H640" stroke="#151820" stroke-width="4"/>
  <path d="M60 370 H200 M420 400 H560 M120 440 H260" stroke="#A97B45" stroke-width="4" stroke-linecap="round"/>

  <!-- drop shadow -->
  <ellipse cx="300" cy="432" rx="150" ry="20" fill="#8F6537"/>

  <!-- ══ MABEL ══ -->
  <g stroke="#151820" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- base -->
    <rect x="215" y="352" width="170" height="76" rx="16" fill="#FDF6E2"/>
    <circle cx="245" cy="428" r="13" fill="#F0762E"/>
    <circle cx="355" cy="428" r="13" fill="#F0762E"/>
    <rect x="272" y="390" width="56" height="10" rx="5" fill="#151820" stroke="none"/>
    <!-- lift column -->
    <rect x="284" y="238" width="32" height="118" rx="6" fill="#FDF6E2"/>
    <line x1="300" y1="260" x2="300" y2="340" stroke="#9A9A9A" stroke-width="4"/>
    <!-- arms (down, slightly out) -->
    <g>
      <rect x="176" y="168" width="34" height="70" rx="16" fill="#FDF6E2" transform="rotate(8 193 203)"/>
      <rect x="182" y="232" width="30" height="62" rx="14" fill="#C9C9C9" transform="rotate(4 197 263)"/>
      <path d="M184 292 q-8 26 6 40 q16 12 28 -4 q8 -14 2 -36 z" fill="#151820"/>
    </g>
    <g>
      <rect x="390" y="168" width="34" height="70" rx="16" fill="#FDF6E2" transform="rotate(-8 407 203)"/>
      <rect x="388" y="232" width="30" height="62" rx="14" fill="#C9C9C9" transform="rotate(-4 403 263)"/>
      <path d="M416 292 q8 26 -6 40 q-16 12 -28 -4 q-8 -14 -2 -36 z" fill="#151820"/>
    </g>
    <!-- torso -->
    <rect x="228" y="140" width="144" height="116" rx="34" fill="#FDF6E2"/>
    <circle cx="238" cy="168" r="20" fill="#E4E4E4"/>
    <circle cx="362" cy="168" r="20" fill="#E4E4E4"/>
    <rect x="268" y="214" width="64" height="22" rx="8" fill="#151820" stroke="none"/>
    <!-- torso halftone shade -->
    <path d="M356 150 q18 24 12 60 q-4 28 -20 40 l18 4 q22 -40 8 -104 z" fill="url(#ht-orange)" stroke="none"/>
    <!-- neck -->
    <rect x="288" y="118" width="24" height="26" rx="7" fill="#9A9A9A"/>
    <!-- antennas -->
    <line x1="248" y1="52" x2="228" y2="14"/>
    <line x1="352" y1="52" x2="372" y2="14"/>
    <circle cx="228" cy="14" r="7" fill="#F0762E"/>
    <circle cx="372" cy="14" r="7" fill="#F0762E"/>
    <!-- head -->
    <rect x="220" y="48" width="160" height="76" rx="34" fill="#FDF6E2"/>
    <rect x="234" y="60" width="132" height="52" rx="24" fill="none" stroke="#F0762E" stroke-width="6"/>
    <!-- eyes: big camera lenses -->
    <circle cx="272" cy="86" r="19" fill="#FFF9F0"/>
    <circle cx="328" cy="86" r="19" fill="#FFF9F0"/>
    <circle cx="272" cy="86" r="11" fill="#151820" stroke="none"/>
    <circle cx="328" cy="86" r="11" fill="#151820" stroke="none"/>
    <circle cx="276" cy="82" r="4" fill="#FFF9F0" stroke="none"/>
    <circle cx="332" cy="82" r="4" fill="#FFF9F0" stroke="none"/>
    <!-- side camera nub -->
    <rect x="372" y="70" width="26" height="20" rx="9" fill="#C9C9C9"/>
  </g>

  <!-- ══ props: Vision Pro + battery ══ -->
  <g stroke="#151820" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- battery block -->
    <rect x="70" y="384" width="86" height="38" rx="8" fill="#151820"/>
    <rect x="86" y="394" width="18" height="18" rx="3" fill="#F2C94C" stroke="none"/>
    <!-- Vision Pro on the floor -->
    <g transform="rotate(-6 505 396)">
      <rect x="450" y="376" width="110" height="44" rx="22" fill="#2A2E3A"/>
      <rect x="446" y="372" width="118" height="24" rx="12" fill="#FDF6E2"/>
      <path d="M560 396 q20 8 14 22" fill="none" stroke-width="4"/>
    </g>
  </g>

  <!-- motion lines: it just waved -->
  <g stroke="#151820" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M148 128 q-14 8 -10 24" fill="none"/>
    <path d="M132 160 q-10 8 -6 20" fill="none"/>
    <path d="M452 128 q14 8 10 24" fill="none"/>
  </g>
</svg>
