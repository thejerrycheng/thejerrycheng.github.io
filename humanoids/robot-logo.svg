<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Humanoid Guide robot mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4a"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf4"/>
      <stop offset="100%" stop-color="#c4cbd6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#rim)"/>
  <!-- antenna -->
  <rect x="61" y="22" width="6" height="12" rx="3" fill="#aeb6c4"/>
  <circle cx="64" cy="20" r="4.5" fill="#5b9bff"/>
  <!-- head -->
  <rect x="34" y="34" width="60" height="52" rx="18" fill="url(#face)"/>
  <rect x="34" y="34" width="60" height="52" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- visor -->
  <rect x="42" y="48" width="44" height="22" rx="11" fill="#1b1e24"/>
  <!-- eyes -->
  <circle cx="55" cy="59" r="5.4" fill="#5b9bff"/>
  <circle cx="73" cy="59" r="5.4" fill="#5b9bff"/>
  <circle cx="56.4" cy="57.4" r="1.6" fill="#cfe2ff"/>
  <circle cx="74.4" cy="57.4" r="1.6" fill="#cfe2ff"/>
  <!-- neck / shoulders -->
  <rect x="56" y="86" width="16" height="8" rx="3" fill="#aeb6c4"/>
  <path d="M40 104 q24 -12 48 0 v6 q-24 -10 -48 0 z" fill="#9aa2b1"/>
</svg>
