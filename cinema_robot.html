<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cinema Robot Arm — Jerry Cheng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root {
      --bg: #f8f6f0;
      --text-main: #111;
      --text-muted: #666;
      --radius-xl: 26px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll {
      overflow: hidden;
    }

    /* HERO SECTION */
    .hero {
      width: 100%;
      padding: clamp(40px, 8vw, 100px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 700;
      margin: 0 0 20px;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards 0.2s;
    }

    .hero-subtitle {
      font-size: clamp(16px, 4vw, 20px);
      max-width: 700px;
      color: var(--text-muted);
      margin: 0 auto 40px;
      opacity: 0;
      line-height: 1.45;
      animation: fadeIn 1.2s ease forwards 0.45s;
    }

/* VIEWER CONTAINER */
#viewer3d {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: min(70vh, 600px);
  border-radius: var(--radius-xl);
  overflow: hidden;
  margin-bottom: 40px;
  background: #ffffff;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.1);
  opacity: 0;
  transform: translateY(20px);
  animation: floatIn 1.2s ease forwards 0.6s;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #ffffff;
  --poster-color: transparent;
  border-radius: var(--radius-xl);
}

/* Mobile support */
@media(max-width: 768px) {
  #viewer3d {
    height: 55vh;        /* fits most phones */
    max-height: 480px;
  }
}

@media(max-width: 480px) {
  #viewer3d {
    height: 45vh;        /* optimized for iPhone */
    max-height: 420px;
  }

  .glass-button {
    width: 36px;
    height: 36px;
  }
}


    /* MODEL-VIEWER */
    model-viewer {
      width: 100%;
      height: 100%;
      background: #ffffff;
      --poster-color: transparent;
      border-radius: var(--radius-xl);
    }

    /* Apple-style blur loading */
    .viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 246, 240, 0.7);
      backdrop-filter: blur(18px);
      z-index: 9;
      transition: opacity 0.35s ease;
    }

    .viewer-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: rgba(0,0,0,0.8);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Apple Glass Buttons */
    .viewer-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .glass-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #111;
      transition: 0.25s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .glass-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(0,0,0,0.22);
    }

    .glass-button.active {
      background: rgba(17,17,17,0.92);
      color: #fff;
    }

    .glass-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
    }

    @media(max-width:480px) {
      #viewer3d { height: 320px; }
      .glass-button { width: 38px; height: 38px; }
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes floatIn { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body>

  <section class="hero">

    <h1 class="hero-title">Cinema Robot Arm<br>for Film Production</h1>

    <p class="hero-subtitle">
      A fully engineered 6-axis cinema robot arm designed to deliver smooth motion control,
      precise tracking shots, and studio-grade reliability for real film production environments.
    </p>

    <!-- Viewer container -->
    <div id="viewer3d">

      <!-- MODEL VIEWER -->
    <model-viewer id="robotViewer"
        src="/assets/models/cinema_robot.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        exposure="1.1"
        shadow-intensity="1"
        touch-action="pan-y"
        ar
    ></model-viewer>

      <!-- Loading -->
      <div id="viewer-loading" class="viewer-loading">
        <div class="spinner"></div>
      </div>

      <!-- Apple UI -->
      <div class="viewer-controls">

        <!-- RESET -->
        <button id="btn-reset" class="glass-button">
          <svg viewBox="0 0 24 24">
            <path d="M7 8H3.5M3.5 8L6 5.5M3.5 8L6 10.5" />
            <path d="M7 8a7 7 0 1 1-1.2 7.3" />
          </svg>
        </button>

        <!-- ROTATE -->
        <button id="btn-rotate" class="glass-button active">
          <svg viewBox="0 0 24 24">
            <path d="M12 3.5a8.5 8.5 0 1 1-6 2.5"/>
            <path d="M8 4H4.5M4.5 4L7 1.5M4.5 4L7 6.5" />
          </svg>
        </button>

        <!-- FULLSCREEN -->
        <button id="btn-fullscreen" class="glass-button">
          <svg id="icon-fullscreen" viewBox="0 0 24 24">
            <rect x="6.5" y="5.5" width="11" height="13" rx="2" />
            <path d="M9 9h6M9 15h6" />
          </svg>
        </button>

      </div>
    </div>

  </section>

  <script>
    const viewer = document.getElementById("robotViewer");
    const loading = document.getElementById("viewer-loading");
    const btnReset = document.getElementById("btn-reset");
    const btnRotate = document.getElementById("btn-rotate");
    const btnFullscreen = document.getElementById("btn-fullscreen");
    const iconFullscreen = document.getElementById("icon-fullscreen");

    /* Hide loading when ready */
    viewer.addEventListener("load", () => {
      loading.classList.add("hide");
    });

    /* Reset camera */
    btnReset.addEventListener("click", () => {
      viewer.cameraOrbit = "0deg 75deg 3m";
      viewer.cameraTarget = "0m 0m 0m";
    });

    /* Toggle auto-rotate */
    btnRotate.addEventListener("click", () => {
      const enabled = viewer.autoRotate;
      viewer.autoRotate = !enabled;
      btnRotate.classList.toggle("active", viewer.autoRotate);
    });

    /* Fullscreen toggle */
    btnFullscreen.addEventListener("click", () => {
      const container = document.getElementById("viewer3d");

      if (!document.fullscreenElement) {
        container.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    /* Change fullscreen icon */
    document.addEventListener("fullscreenchange", () => {
      const fs = document.fullscreenElement;

      if (fs) {
        // Turn into an X
        iconFullscreen.innerHTML = `<path d="M7 7l10 10M17 7L7 17"/>`;
        btnFullscreen.classList.add("active");
      } else {
        // Restore rectangle
        iconFullscreen.innerHTML = `
          <rect x="6.5" y="5.5" width="11" height="13" rx="2" />
          <path d="M9 9h6M9 15h6" />
        `;
        btnFullscreen.classList.remove("active");
      }
    });
  </script>

</body>
</html>
