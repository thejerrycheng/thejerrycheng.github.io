name: Update dashboard stats

# Refreshes stats.json (visitors / TikTok / Scholar) on a schedule so the
# homepage dashboard stays current. Best-effort: if a source is unreachable,
# the previous value is kept. GitHub stars update live client-side; X is manual.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC, best-effort)
  workflow_dispatch: {}       # allow manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stats.json
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats.json; then
            echo "stats.json unchanged — nothing to commit"
          else
            git config user.name "stats-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "chore: refresh dashboard stats [skip ci]"
            git push
          fi
